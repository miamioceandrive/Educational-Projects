<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <link rel="stylesheet" href="css/style.css" />

    <title>TO DO App</title>
  </head>
  <body>
    <div class="app">
      <!-- Основной экран -->
      <main class="screen">
        <header class="header">
          <h1 class="header-weekday">Среда</h1>
          <p class="header-date">3 января</p>
        </header>

        <form class="search" role="search">
          <input
            class="search-input"
            type="search"
            name="search"
            placeholder="Поиск"
            aria-label="Поиск"
          />
          <span class="search-icon material-symbols-outlined" aria-hidden="true"
            >search</span
          >
        </form>

        <div class="filters" role="tablist" aria-label="Фильтр задач">
          <button
            class="filters-tab filters-tab-active"
            type="button"
            role="tab"
            aria-selected="true"
            data-filter="all"
          >
            <span
              class="filters-tab-check material-symbols-outlined"
              aria-hidden="true"
              >check</span
            >
            Все
          </button>
          <button
            class="filters-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-filter="active"
          >
            Активные
          </button>
          <button
            class="filters-tab"
            type="button"
            role="tab"
            aria-selected="false"
            data-filter="done"
          >
            Завершенные
          </button>
        </div>

        <ul class="task-list"></ul>

        <button class="fab" type="button" aria-label="Добавить задачу">
          <span class="material-symbols-outlined" aria-hidden="true">edit</span>
        </button>
      </main>

      <!-- Модалка -->
      <div class="modal">
        <div class="modal-overlay"></div>

        <div
          class="modal-sheet"
          role="dialog"
          aria-modal="true"
          aria-label="Новая задача"
        >
          <span class="modal-handle" aria-hidden="true"></span>

          <form class="modal-form">
            <div class="field">
              <input
                class="field-input"
                type="text"
                name="description"
                placeholder="Описание"
                aria-label="Описание"
              />
            </div>

            <div class="field">
              <input
                class="field-input"
                type="datetime-local"
                name="date"
                aria-label="Дата и время"
              />
            </div>

            <div class="reminder">
              <span class="reminder-label">Напомнить мне</span>
              <label class="switch">
                <input class="switch-input" type="checkbox" checked />
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb">
                    <span class="switch-icon material-symbols-outlined"
                      >check</span
                    >
                  </span>
                </span>
              </label>
            </div>

            <div class="modal-actions">
              <button class="btn btn-primary" type="submit">Добавить</button>
              <button class="btn btn-outline" type="button">Отмена</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="scripts/script.js"></script>
  </body>
</html>
