<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Регистрация и авторизация</title>
  </head>
  <body>
    <div class="form-block">
      <h2>Регистрация</h2>

      <label for="name">Имя</label>
      <input id="name" class="name" type="text" /> <br />

      <label for="phone">Телефон</label>
      <input id="phone" class="phone" type="text" /> <br />

      <label for="email">Email</label>
      <input id="email" class="email" type="text" /> <br />

      <label for="password">Пароль</label>

      <input id="password" class="password" type="password" /> <br />

      <button class="signup">Зарегистрироваться</button>

      <p class="signupMessage"></p>
    </div>

    <div class="form-block">
      <h2>Вход</h2>

      <label for="emailLogin">Email</label>
      <input id="emailLogin" class="emailLogin" type="text" /> <br />

      <label for="passwordLogin">Пароль</label>
      <input id="passwordLogin" class="passwordLogin" type="password" /> <br />

      <button class="login">Войти</button>

      <p class="loginMessage"></p>
    </div>

    <script src="scripts/script.js"></script>
  </body>
</html>
